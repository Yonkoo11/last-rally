<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0A0A0C;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #FAFAFA;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 96px;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #00d4ff 0%, #14f195 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 32px;
            color: #B0B0B0;
            margin-bottom: 60px;
            font-weight: 500;
        }
        .links {
            font-size: 28px;
            color: #00d4ff;
            margin-bottom: 40px;
        }
        .hackathon {
            font-size: 24px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LAST RALLY</h1>
        <div class="subtitle">Open Source • Devnet Deployed</div>
        <div class="links">github.com/Yonkoo11/last-rally</div>
        <div class="hackathon">Built for Graveyard Hackathon 2026</div>
    </div>
</body>
</html>
