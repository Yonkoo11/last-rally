<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0A0A0C;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #FAFAFA;
        }
        .container {
            text-align: center;
            max-width: 800px;
        }
        h1 {
            font-size: 52px;
            font-weight: 700;
            margin-bottom: 60px;
            letter-spacing: -1px;
        }
        .tokens {
            display: flex;
            gap: 40px;
            justify-content: center;
            margin-bottom: 60px;
        }
        .token {
            width: 180px;
            height: 180px;
            border-radius: 16px;
            background: #1A1A1C;
            border: 2px solid #2A2A2C;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .token.bonk {
            background: linear-gradient(135deg, #FF6B00 0%, #FFA500 100%);
            border: 3px solid #FFD700;
            transform: scale(1.1);
            box-shadow: 0 20px 60px rgba(255, 165, 0, 0.4);
        }
        .token.bonk::after {
            content: '← Premium cosmetics unlock';
            position: absolute;
            right: -320px;
            font-size: 20px;
            color: #FFD700;
            white-space: nowrap;
        }
        .description {
            font-size: 20px;
            line-height: 1.8;
            color: #B0B0B0;
            max-width: 700px;
            margin: 0 auto;
        }
        .description strong {
            color: #14F195;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MULTI-TOKEN WAGERS</h1>
        <div class="tokens">
            <div class="token">SOL</div>
            <div class="token bonk">BONK</div>
            <div class="token">USDC</div>
        </div>
        <div class="description">
            Anchor program creates <strong>escrow PDA</strong><br/>
            Winner-takes-all settlement<br/>
            Instant • Trustless • No intermediary
        </div>
    </div>
</body>
</html>
