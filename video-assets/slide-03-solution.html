<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0A0A0C;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #FAFAFA;
        }
        .container {
            text-align: center;
            max-width: 1200px;
        }
        h1 {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #14f195 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 32px;
            color: #B0B0B0;
            margin-bottom: 80px;
        }
        .flow {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto 1fr;
            gap: 40px;
            align-items: center;
            margin-bottom: 80px;
        }
        .step {
            background: #1A1A1C;
            border-radius: 16px;
            padding: 40px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .step-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .step-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #14f195;
        }
        .step-desc {
            font-size: 18px;
            color: #999;
        }
        .arrow {
            font-size: 48px;
            color: #14f195;
        }
        .highlight {
            font-size: 28px;
            color: #14f195;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SOLANA FIXES THIS</h1>
        <div class="subtitle">Trustless • Instant • No Intermediary</div>

        <div class="flow">
            <div class="step">
                <div class="step-icon">🎮</div>
                <div class="step-title">Pick Token</div>
                <div class="step-desc">SOL, BONK, or USDC</div>
            </div>

            <div class="arrow">→</div>

            <div class="step">
                <div class="step-icon">🔒</div>
                <div class="step-title">Escrow PDA</div>
                <div class="step-desc">Anchor program locks funds</div>
            </div>

            <div class="arrow">→</div>

            <div class="step">
                <div class="step-icon">🏆</div>
                <div class="step-title">Winner Paid</div>
                <div class="step-desc">Instant settlement</div>
            </div>
        </div>

        <div class="highlight">90 seconds start to finish</div>
    </div>
</body>
</html>
