<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1A0800 0%, #0A0A0C 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #FAFAFA;
        }
        .container {
            text-align: center;
        }
        .logo {
            font-size: 180px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 120px;
            font-weight: 800;
            margin-bottom: 30px;
            letter-spacing: 8px;
            background: linear-gradient(135deg, #FFD700 0%, #FF6B00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tagline {
            font-size: 32px;
            color: #999;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 60px;
        }
        .badge {
            display: inline-block;
            background: rgba(20, 241, 149, 0.1);
            border: 2px solid #14f195;
            color: #14f195;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🔥</div>
        <h1>LAST RALLY</h1>
        <div class="tagline">FAST. FIERCE. FINAL.</div>
        <div class="badge">▸ PLAY ON SOLANA DEVNET</div>
    </div>
</body>
</html>
